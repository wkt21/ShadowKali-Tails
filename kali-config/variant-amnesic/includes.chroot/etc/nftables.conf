#!/usr/sbin/nft -f
# ShadowKali-Tails – fail-closed transparent Tor proxy
# Only the Tor daemon (debian-tor) may reach the clearnet.
# All other TCP is redirected to TransPort; DNS is redirected to DNSPort.
# IPv6 is dropped for simplicity (same pragmatic choice as classic Tails).

flush ruleset

define tor_uid   = 106          # overwritten at build time by 02-tor-proxy.chroot
define trans_port = 9040
define dns_port   = 5353
define virt_addr  = 10.192.0.0/10

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        # Local Tor ports only from localhost
        tcp dport { 9050, $trans_port, $dns_port } ip saddr 127.0.0.1 accept
        icmp type echo-request limit rate 5/second accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy drop;
        oif "lo" accept
        ct state established,related accept

        # Tor daemon itself may talk to the clearnet
        meta skuid $tor_uid accept

        # Allow applications to reach local TransPort / Socks / DNSPort
        tcp dport { $trans_port, 9050 } ip daddr 127.0.0.1 accept
        udp dport $dns_port ip daddr 127.0.0.1 accept

        # Everything else is rejected (fail-closed)
        reject
    }
}

table ip nat {
    chain output {
        type nat hook output priority -100; policy accept;

        # Virtual .onion addresses → TransPort
        ip daddr $virt_addr tcp dport != 0 redirect to :$trans_port

        # DNS → Tor DNSPort
        udp dport 53 redirect to :$dns_port
        tcp dport 53 redirect to :$dns_port

        # All other outbound TCP from non-tor users → TransPort
        meta skuid != $tor_uid tcp flags syn / syn,ack redirect to :$trans_port
    }
}
